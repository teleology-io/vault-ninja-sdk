name: Release vn CLI

# Builds the zero-knowledge vn CLI/MCP binary (go/cmd/vn) for every
# platform, publishes a GitHub release, tags the Go submodule so
# `go install github.com/teleology-io/vault-ninja-sdk/go/cmd/vn@latest`
# works, and (when HOMEBREW_TAP_DEPLOY_KEY or HOMEBREW_TAP_TOKEN is set)
# updates the Homebrew formula in teleology-io/homebrew-tap.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'vn version (e.g. 0.1.0)'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/cmd/vn/go.mod
          cache-dependency-path: go/cmd/vn/go.sum

      - name: Vet
        working-directory: go/cmd/vn
        run: go vet ./...

      - name: Build
        working-directory: go/cmd/vn
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="vn_${VERSION}_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/teleology-io/vault-ninja-sdk/go/cmd/vn/internal/api.Version=v${VERSION}" \
              -o "dist/$name/vn$ext" .
            cp README.md "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Tag
        run: |
          git tag "vn/v${VERSION}"
          git tag "go/cmd/vn/v${VERSION}"
          git push origin "vn/v${VERSION}" "go/cmd/vn/v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vn/v${{ inputs.version }}
          name: vn v${{ inputs.version }}
          files: |
            go/cmd/vn/dist/*.tar.gz
            go/cmd/vn/dist/*.zip
            go/cmd/vn/dist/checksums.txt

      - name: Update Homebrew formula
        env:
          # Either works. Preferred: a write-enabled deploy key on the tap
          # repo (scoped to that one repo, no org token settings needed).
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TAP_DEPLOY_KEY}" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "${TAP_DEPLOY_KEY}" > ~/.ssh/tap_key
            chmod 600 ~/.ssh/tap_key
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
            TAP_URL="git@github.com:teleology-io/homebrew-tap.git"
          elif [ -n "${TAP_TOKEN}" ]; then
            TAP_URL="https://x-access-token:${TAP_TOKEN}@github.com/teleology-io/homebrew-tap.git"
          else
            echo "No HOMEBREW_TAP_DEPLOY_KEY or HOMEBREW_TAP_TOKEN — skipping Homebrew update"; exit 0
          fi
          sum() { grep "vn_${VERSION}_$1.tar.gz" go/cmd/vn/dist/checksums.txt | cut -d' ' -f1; }
          sed -e "s/{{VERSION}}/${VERSION}/g" \
              -e "s/{{SHA_DARWIN_ARM64}}/$(sum darwin_arm64)/" \
              -e "s/{{SHA_DARWIN_AMD64}}/$(sum darwin_amd64)/" \
              -e "s/{{SHA_LINUX_ARM64}}/$(sum linux_arm64)/" \
              -e "s/{{SHA_LINUX_AMD64}}/$(sum linux_amd64)/" \
              go/cmd/vn/packaging/vn.rb.tmpl > vn.rb
          git clone "${TAP_URL}" tap
          mkdir -p tap/Formula && mv vn.rb tap/Formula/vn.rb
          cd tap
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add Formula/vn.rb
          git commit -m "vn ${VERSION}"
          # explicit ref: the tap may be empty (no upstream branch yet)
          git push origin HEAD:master
